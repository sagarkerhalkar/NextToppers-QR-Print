{% extends 'base.html' %}
{% block content %}
<section class="page-head compact"><div><p class="eyebrow">SECURITY</p><h1>Change password</h1><p class="muted">Update the password for your signed-in account.</p></div></section><section class="card" style="max-width:560px">{% if error %}<div class="alert">{{ error }}</div>{% endif %}{% if success %}<div class="successbox">{{ success }}</div>{% endif %}<form class="stack" method="post" action="/admin/password"><div><label>Current password</label><input type="password" name="current_password" required></div><div><label>New password</label><input type="password" name="new_password" minlength="8" required></div><button class="primary">Change password</button></form></section>
{% endblock %}
