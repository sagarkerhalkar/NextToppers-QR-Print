name: V2.0 - Build Windows Installer EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
      - 'packages/v2.0.0/**'
      - 'README.md'

permissions:
  contents: read

jobs:
  build-installer:
    runs-on: windows-latest
    env:
      LAN_REQUIRED: '0'
      PRINT_BACKEND: mock
      APP_SECRET: github-actions-v2-build-secret
    steps:
      - name: Checkout V2.0 source package branch
        uses: actions/checkout@v4
        with:
          ref: v2.0-source
          fetch-depth: 1

      - name: Reconstruct V2.0 source
        shell: pwsh
        run: |
          $parts = Get-ChildItem 'packages/v2.0.0/source14.tgz.b64.part*' | Sort-Object Name
          if (-not $parts) { throw 'V2.0 source package parts not found' }
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes('v2-source.tgz', [Convert]::FromBase64String($b64))
          New-Item -ItemType Directory -Force buildsrc | Out-Null
          tar -xzf v2-source.tgz -C buildsrc
          if (Test-Path 'buildsrc/build_windows.ps1') {
            $src = (Resolve-Path 'buildsrc').Path
          } else {
            $candidate = Get-ChildItem buildsrc -Directory -Recurse | Where-Object { Test-Path (Join-Path $_.FullName 'build_windows.ps1') } | Select-Object -First 1
            if (-not $candidate) { throw 'build_windows.ps1 not found after source extraction' }
            $src = $candidate.FullName
          }
          "SRC_ROOT=$src" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "V2.0 source root: $src"

      - name: Install Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Test V2.0 source
        shell: pwsh
        run: |
          Set-Location $env:SRC_ROOT
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          python -m pip check
          python -m compileall -q app tests
          pytest -q

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build standalone EXEs and Setup EXE
        shell: pwsh
        run: |
          Set-Location $env:SRC_ROOT
          .\build_windows.ps1
          if (-not (Test-Path 'dist/NextToppers-QR-Print-Setup-v2.0.0.exe')) { throw 'Installer EXE was not produced' }
          if (-not (Test-Path 'dist/app/NextToppersQRPrint.exe')) { throw 'Standalone EXE was not produced' }
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE/out" | Out-Null
          Copy-Item 'dist/NextToppers-QR-Print-Setup-v2.0.0.exe' "$env:GITHUB_WORKSPACE/out/NextToppers-QR-Print-Setup-v2.0.0.exe" -Force
          Copy-Item 'dist/app/NextToppersQRPrint.exe' "$env:GITHUB_WORKSPACE/out/NextToppersQRPrint-v2.0.0.exe" -Force

      - name: Smoke-test standalone EXE
        shell: pwsh
        run: |
          $env:LAN_REQUIRED='0'
          $env:PRINT_BACKEND='mock'
          $p = Start-Process -FilePath "$env:GITHUB_WORKSPACE/out/NextToppersQRPrint-v2.0.0.exe" -PassThru
          try {
            $ok=$false
            for($i=0;$i -lt 45;$i++){
              Start-Sleep -Seconds 1
              try {
                $r=Invoke-RestMethod http://127.0.0.1:8765/health -TimeoutSec 2
                if($r.ok){$ok=$true;break}
              } catch {}
            }
            if(-not $ok){ throw 'Packaged EXE health check failed' }
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: NextToppers-QR-Print-v2.0.0-Windows
          path: out/*
          if-no-files-found: error
          retention-days: 30
